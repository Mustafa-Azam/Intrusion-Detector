# Run the test suite on every push and pull request.
name: tests

on:
  push:
  pull_request:

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # show results for every Python version, not just the first failure
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Smoke-test the CLI on the demo capture
        run: |
          python scripts/make_demo_pcap.py demo.pcap
          python -m analyzer analyze demo.pcap --outbound-mb 1 --report report.md
          grep -q "Alerts:\*\* 5" report.md
